apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: analytics-export
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS shipments (
      id SERIAL PRIMARY KEY,
      client_id INT NOT NULL,
      driver_id INT,
      vehicle_id INT,
      status TEXT NOT NULL,
      created_at TIMESTAMP NOT NULL DEFAULT NOW()
    );
    INSERT INTO shipments (client_id, driver_id, vehicle_id, status)
    SELECT
      (random() * 100)::int + 1,
      (random() * 50)::int + 1,
      (random() * 20)::int + 1,
      (ARRAY['created','in_transit','delivered'])[1 + (random() * 2)::int]
    FROM generate_series(1, 100);
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: analytics-export
type: Opaque
stringData:
  POSTGRES_USER: analytics
  POSTGRES_PASSWORD: analytics
  POSTGRES_DB: analytics
  DATABASE_URL: postgresql://analytics:analytics@postgres:5432/analytics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: analytics-export
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "analytics"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: analytics-export
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
